distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# AGP 8.11.1 + Gradle: 9.6.0 убрал `org.gradle.api.problems.internal.InternalProblems`,
# который AGP 8.11.x ещё использует. Пин на 9.5.0 (последняя совместимая).
# Альтернативы:
#   - AGP 8.12+ (когда выйдет stable с починкой)
#   - AGP 9.x (требует Flutter Gradle Plugin 2.0, ещё не stable)
# См. https://docs.gradle.org/9.6.1/userguide/upgrading_version_9.html#agp_8x_incompatible
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.0-all.zip
