name: quran_app
description: "Modern Offline-First Quran application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0
  http: ^1.2.0

  # Database
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0

  # Local preferences
  shared_preferences: ^2.3.3

  # Formatting
  intl: ^0.20.2

  # Audio (stub for MVP v0.2)
  just_audio: ^0.9.42
  audio_service: ^0.18.18

  # Crypto for content integrity (SHA256 уже в `crypto`; ED25519 — `cryptography`).
  crypto: ^3.0.5
  cryptography: ^2.7.0

  # SVG-иконки для главного экрана и других UI-мест.
  flutter_svg: ^2.0.10+1

  # Crash reporting (Sprint 1.2). Активируется через
  # `--dart-define=SENTRY_DSN=<dsn>`; без DSN — no-op (см.
  # `lib/core/observability/sentry_bootstrap.dart`).
  sentry_flutter: ^8.10.0
  # MCP: используем только бинарь Arenukvern/mcp_flutter (см. AGENTS.md).
  # In-app `mcp_toolkit` НЕ подключаем — upstream-баг с
  # `intentcall_platform` ломает Android-сборку.

dev_dependencies:
  flutter_test:
    sdk: flutter
  # `test` не указано явно — `flutter_test` уже тянет compatible версию.
  # `test ^1.25.0` здесь ломал pub-resolve с riverpod_generator
  # (тянет analyzer ^6.7.0 vs flutter_test ≥1.25.0 analyzer <11.0.0).
  flutter_lints: ^6.0.0
  drift_dev: ^2.21.2
  build_runner: ^2.4.13
  args: ^2.5.0
  # riverpod_generator — code-gen для @riverpod аннотаций.
  # Sprint 1.4: scaffold (только deps + один @riverpod в providers.dart
  # как proof-of-concept). Полная миграция всех 25+ провайдеров — отдельный
  # PR после Sprint 2, когда будет покрытие тестами.
  # TODO(Sprint 2 testing): добавить когда нужен будет riverpod_generator
  # без analyzer-конфликта. Сейчас `any` для обхода conflict.
  riverpod_generator: any
  riverpod_annotation: ^2.6.1
  # Sprint 2 testing (Sprint 2.7 — FTS5 unit-тесты):
  # - sqflite_common_ffi: in-memory FTS5 testing (SearchDao)
  # - mocktail: моки для RecitersSyncService, AudioCache
  # - sentry_flutter перенесён в dependencies (Sprint 1.2).
  sqflite_common_ffi: ^2.3.0
  mocktail: ^1.0.0
  # integration_test — для будущего Sprint 2 (тесты на device):
  # integration_test: ^8.0.0
  # golden_toolkit — для UI snapshot-тестов:
  # golden_toolkit: ^1.0.0
  # TODO(Sprint 1.2 done): sentry_flutter подключён в dependencies выше.

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/quran_seed/quran_full.json
    # Фон главного экрана — мечеть справа сверху, как на макете.
    # Генерируется `tool/build_home_background.py` из
    # `docs/images/background.webp`.
    - assets/images/backgrounds/home_background.webp
    # Орнамент-рамка для заголовка суры на экране чтения.
    # Источник: `docs/images/ChatGPT Image 29 июн. 2026 г., 21_12_49.webp`.
    - assets/images/ornaments/surah_header_frame.webp
    # PNG-иконки главного экрана, извлечённые из дизайн-макета.
    # При добавлении нового файла в `assets/icons/home/` — он
    # подхватится автоматически (см. `tool/extract_mockup_icons.py`).
    - assets/icons/home/
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/amiri/Amiri-Regular.ttf
        - asset: assets/fonts/amiri/Amiri-Bold.ttf
          weight: 700
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/scheherazadenew/ScheherazadeNew-Variable.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/notonaskh/NotoNaskhArabic.ttf
    # Mushaf Hafs — King Fahd Glorious Quran Printing Complex
    # (KFGQPC). Используется в современной печатной Mushaf
    # Hafs-narration от Саудовской типографии.
    - family: KFGQPC Uthman Taha Naskh
      fonts:
        - asset: assets/fonts/KFGQPC Uthman Taha Naskh Regular/KFGQPC Uthman Taha Naskh Regular.ttf
    # Mushaf Medinah — старый формат, использовался в Mushaf
    # Medinah до перехода на KFGQPC.
    - family: PDMS Saleem QuranFont
      fonts:
        - asset: assets/fonts/PDMS_Saleem_QuranFont Regular/_PDMS_Saleem_QuranFont Regular.ttf
    # QPC Hafs — вариант QPC, основан на Uthman Taha.
    - family: QPC Hafs
      fonts:
        - asset: assets/fonts/QPC Hafs.ttf
    # Глифовые шрифты для отрисовки арабских названий сур.
    # Каждая сура закодирована в Private Use Area: `surah001`
    # соответствует U+E001, `surah002` → U+E002, …, `surah114` → U+E072.
    # Используются в:
    #   - `Surah Name V4` — список сур (см. `SurahRow`).
    #   - `Surah Name V2` — экран чтения суры (`SurahHeader` + `_AnimatedTopBar`).
    - family: Surah Name V4
      fonts:
        - asset: assets/fonts/Surah Name V4.ttf
    - family: Surah Name V2
      fonts:
        - asset: assets/fonts/Surah Name V2.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Variable.ttf
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/cormorantgaramond/CormorantGaramond-Variable.ttf
