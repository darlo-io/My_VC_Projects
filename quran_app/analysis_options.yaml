include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # Dev-скрипты (`tool/`) исключены из analyze — `print` и простая
    # конкатенация строк в CLI-утилитах оправданы. Оставлены только
    # `flutter analyze` для production-кода в `lib/` и тестов в `test/`.
    - "tool/**"
    - "tools/**"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    prefer_const_declarations: true
    avoid_print: true
    require_trailing_commas: true
    sort_child_properties_last: true
    use_super_parameters: true
    unnecessary_await_in_return: true
    unawaited_futures: true
    # Отключено в проекте (см. `lib/features/audio/data/audio_player_controller.dart`,
    # `lib/features/quran/data/ayahs_service.dart` и т.п.): конструкторы с
    # nullable optional параметрами и приватными полями с `??`-default
    # не могут быть initializing formals без обязательного значения.
    # `unnecessary_lambdas` отключён аналогично — на наших виджетах
    # `() => onTap()` не всегда читабельнее, чем `() { … }` с комментарием.
    prefer_initializing_formals: false
    unnecessary_lambdas: false
